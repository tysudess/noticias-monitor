name: Integrate PDF Editor V2

on:
  push:
    branches:
      - work/v8-next
    paths:
      - '.github/workflows/integrate-pdf-editor-v2.yml'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt'
      - 'desktop/src/main/resources/pdf-default-cover.b64'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-next
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Integrate full-screen PDF editor V2
        shell: pwsh
        run: |
          $pdf = 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt'
          $p = Get-Content $pdf -Raw
          $p = $p.Replace('fun PdfEditorScreenV2() { SwingPanel(modifier = Modifier.fillMaxSize(), factory = { PdfEditorV2Panel() }) }', 'fun PdfEditorScreenV2(onExit: () -> Unit = {}) { SwingPanel(modifier = Modifier.fillMaxSize(), factory = { PdfEditorV2Panel(onExit) }) }')
          $p = $p.Replace('private class PdfEditorV2Panel : JPanel(BorderLayout()) {', 'private class PdfEditorV2Panel(private val onExit: () -> Unit) : JPanel(BorderLayout()) {')
          $oldGear = 'right.add(styledSquareButton("⚙") { JOptionPane.showMessageDialog(this,"Configurações do Monitor ficam na aba Configurações.","Editor de PDF",JOptionPane.INFORMATION_MESSAGE) })'
          $newGear = 'right.add(styledSquareButton("⚙") { onExit() })'
          $p = $p.Replace($oldGear, $newGear)
          Set-Content $pdf $p -Encoding UTF8

          $dashboard = 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt'
          $d = Get-Content $dashboard -Raw
          $old = @'
    Column(Modifier.fillMaxSize().background(V5Bg)) {
        Row(Modifier.weight(1f).fillMaxWidth()) {
            V5Sidebar(section, { section = it }, c, tick)
            Column(Modifier.weight(1f).fillMaxHeight()) {
                if (section == V5Section.HOME) {
                    V5HomeHeader(c, { section = it }, tick)
                    V5Home(c, { section = it }, tick)
                } else {
                    V5PageHeader(section, c, tick)
                    Box(
                        Modifier.weight(1f).fillMaxWidth()
                            .padding(horizontal = 18.dp, vertical = 10.dp)
                    ) {
                        when (section) {
                            V5Section.NEWS -> V5NewsScreen(c, tick)
                            V5Section.VIDEOS -> V5VideosScreen(c, tick)
                            V5Section.DEMANDS -> V5DemandsScreen(c, tick)
                            V5Section.SOURCES -> V5SourcesScreen(c, tick)
                            V5Section.HISTORY -> V5HistoryScreen(c, tick)
                            V5Section.TERMS -> V5TermsScreen(c, tick)
                            V5Section.STOP -> V5StopScreen(c, tick)
                            V5Section.SETTINGS -> V5SettingsScreen(c, tick)
                            V5Section.PDF_EDITOR -> PdfEditorScreen()
                            else -> Unit
                        }
                    }
                }
            }
        }
        V5Footer(c, tick)
    }
'@
          $new = @'
    if (section == V5Section.PDF_EDITOR) {
        PdfEditorScreenV2 { section = V5Section.HOME }
    } else {
        Column(Modifier.fillMaxSize().background(V5Bg)) {
            Row(Modifier.weight(1f).fillMaxWidth()) {
                V5Sidebar(section, { section = it }, c, tick)
                Column(Modifier.weight(1f).fillMaxHeight()) {
                    if (section == V5Section.HOME) {
                        V5HomeHeader(c, { section = it }, tick)
                        V5Home(c, { section = it }, tick)
                    } else {
                        V5PageHeader(section, c, tick)
                        Box(
                            Modifier.weight(1f).fillMaxWidth()
                                .padding(horizontal = 18.dp, vertical = 10.dp)
                        ) {
                            when (section) {
                                V5Section.NEWS -> V5NewsScreen(c, tick)
                                V5Section.VIDEOS -> V5VideosScreen(c, tick)
                                V5Section.DEMANDS -> V5DemandsScreen(c, tick)
                                V5Section.SOURCES -> V5SourcesScreen(c, tick)
                                V5Section.HISTORY -> V5HistoryScreen(c, tick)
                                V5Section.TERMS -> V5TermsScreen(c, tick)
                                V5Section.STOP -> V5StopScreen(c, tick)
                                V5Section.SETTINGS -> V5SettingsScreen(c, tick)
                                else -> Unit
                            }
                        }
                    }
                }
            }
            V5Footer(c, tick)
        }
    }
'@
          if (-not $d.Contains($old)) { throw 'Bloco V5App esperado não encontrado; integração abortada com segurança.' }
          $d = $d.Replace($old, $new)
          Set-Content $dashboard $d -Encoding UTF8

      - name: Compile desktop
        shell: pwsh
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Commit validated integration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: activate full-screen PDF editor V2 layout and precise crop'
            git push origin HEAD:work/v8-next
          }
