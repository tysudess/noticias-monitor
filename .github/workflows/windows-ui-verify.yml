name: Verify Windows UI

on:
  push:
    branches:
      - ui/dashboard-match
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile desktop Kotlin
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Create Windows distributable
        run: gradle :desktop:createDistributable --stacktrace

      - name: Upload Windows portable app image
        uses: actions/upload-artifact@v4
        with:
          name: monitor-de-noticias-windows-ui-preview
          path: desktop/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 7
