name: Verify Windows UI

on:
  push:
    branches:
      - ui/dashboard-match
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile desktop Kotlin
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Create Windows distributable
        run: gradle :desktop:createDistributable --stacktrace

      - name: Verify packaged JVM modules
        shell: pwsh
        run: |
          $release = Get-Content 'desktop/build/compose/binaries/main/app/MonitorDeNoticias/runtime/release' -Raw
          Write-Host $release
          foreach ($module in @('java.sql', 'java.instrument', 'jdk.unsupported')) {
            if ($release -notmatch [regex]::Escape($module)) {
              throw "Required JVM module missing from packaged runtime: $module"
            }
          }

      - name: Verify packaged launcher initializes
        shell: pwsh
        run: |
          # Hosted GitHub Windows runners do not expose a usable interactive desktop,
          # so MainWindowTitle is not a reliable GUI assertion here. We still launch
          # the packaged EXE and fail if it terminates immediately.
          $exe = Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias/MonitorDeNoticias.exe'
          $p = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) {
              throw "Packaged launcher exited early with code $($p.ExitCode)"
            }
            Write-Host "Packaged launcher remained alive after initialization window."
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Upload Windows portable app image
        uses: actions/upload-artifact@v4
        with:
          name: monitor-de-noticias-windows-ui-preview
          path: desktop/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 7
