name: Release V8 PDF Editor Final Sidebar Portable

on:
  push:
    branches:
      - work/v8-next-a4-crop-fix
    paths:
      - .github/workflows/release-v8-pdf-editor-sidebar-final.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-next-a4-crop-fix
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply final sidebar layout
        shell: pwsh
        run: |
          python .github/scripts/finalize_pdf_sidebar.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt
          git commit -m "feat: finalize PDF editor sidebar and remove export panel"
          git push origin HEAD:work/v8-next-a4-crop-fix

      - name: Build Windows portable
        shell: pwsh
        run: |
          gradle.bat :desktop:compileKotlin --no-daemon
          gradle.bat :desktop:createDistributable --no-daemon
          if (-not (Test-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias/MonitorDeNoticias.exe')) { throw 'MonitorDeNoticias.exe nao encontrado' }

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias/*' -DestinationPath 'release/Monitor-de-Noticias-V8-Editor-PDF-Final-Sidebar-Windows-Portable.zip' -Force
          (Get-FileHash 'release/Monitor-de-Noticias-V8-Editor-PDF-Final-Sidebar-Windows-Portable.zip' -Algorithm SHA256).Hash.ToLower() + '  Monitor-de-Noticias-V8-Editor-PDF-Final-Sidebar-Windows-Portable.zip' | Set-Content 'release/Monitor-de-Noticias-V8-Editor-PDF-Final-Sidebar-Windows-Portable.zip.sha256'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8-pdf-editor-final-sidebar-20260911
          name: Monitor de Notícias V8 + Editor PDF Final Sidebar — Windows Portable
          body: Editor PDF com barra lateral final baseada na referência, painel Capa e Exportação removido e área de edição ampliada. Mantidas correções de corte e qualidade.
          files: |
            release/Monitor-de-Noticias-V8-Editor-PDF-Final-Sidebar-Windows-Portable.zip
            release/Monitor-de-Noticias-V8-Editor-PDF-Final-Sidebar-Windows-Portable.zip.sha256
