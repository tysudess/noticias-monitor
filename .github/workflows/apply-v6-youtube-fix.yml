name: Apply V6 YouTube parser fix

on:
  push:
    branches:
      - ui/dashboard-match
    paths:
      - tools/fix-v6-youtube-parser.py
      - .github/workflows/apply-v6-youtube-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/dashboard-match
          fetch-depth: 0

      - name: Apply parser fix
        run: python tools/fix-v6-youtube-parser.py

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          git commit -m "fix(video): parse YouTube Videos tab without fragile regex escaping"
          git push origin HEAD:ui/dashboard-match
