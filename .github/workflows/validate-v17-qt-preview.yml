name: Validate V17 Qt Preview

on:
  push:
    branches:
      - work/v17-qt-preview-engine

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Monitor with Qt bridge
        shell: pwsh
        run: gradle :desktop:compileKotlin --stacktrace
