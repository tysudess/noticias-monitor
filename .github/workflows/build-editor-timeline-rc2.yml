name: Build Monitor Editor Timeline RC2

on:
  push:
    branches:
      - integration/video-editor-separated-v1
    paths:
      - '.github/workflows/build-editor-timeline-rc2.yml'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/NativeVideoEditor.kt'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: integration/video-editor-separated-v1
          fetch-depth: 0

      - name: Download validated private VideoCoreBridge artifact
        uses: actions/download-artifact@v4
        with:
          repository: tysudess/extrator-video-windows
          run-id: '34504332118'
          name: video-core-bridge-v3.0.1
          path: video-core
          github-token: ${{ github.token }}

      - name: Expand validated Video core
        shell: pwsh
        run: |
          $inner = Get-ChildItem 'video-core' -Recurse -Filter 'VideoCoreBridge-v3.0.1.zip' | Select-Object -First 1
          if (-not $inner) { throw 'VideoCoreBridge-v3.0.1.zip ausente.' }
          New-Item -ItemType Directory -Force -Path '_video-core' | Out-Null
          Expand-Archive -Path $inner.FullName -DestinationPath '_video-core' -Force
          $bridge = Get-ChildItem '_video-core' -Recurse -Filter 'VideoCoreBridge.exe' | Select-Object -First 1
          if (-not $bridge) { throw 'VideoCoreBridge.exe ausente.' }

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout News Extractor headless engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch integration/monitor-headless https://github.com/tysudess/Extrator-de-noticias-windows.git _news-src
          if (-not (Test-Path '_news-src/monitor-bridge.js')) { throw 'News headless bridge ausente.' }

      - name: Install News dependencies
        shell: pwsh
        working-directory: _news-src
        run: npm install --omit=dev --no-audit --no-fund

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify timeline import fix source
        shell: pwsh
        run: |
          $editor = Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/NativeVideoEditor.kt' -Raw
          foreach ($anchor in @('ffprobeFile','ProcessBuilder(','durationSeconds','clips += c','Timeline pronta')) {
            if ($editor -notmatch [regex]::Escape($anchor)) { throw "Correção de importação ausente: $anchor" }
          }
          if ($editor -match '(?m)^import javafx\.|SwingPanel|JFXPanel\(') { throw 'Editor voltou a depender de JavaFX/Swing.' }

      - name: Compile Monitor
        shell: pwsh
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Create Windows distributable
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Install News core
        shell: pwsh
        run: |
          $root = 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $dest = Join-Path $root 'tools/ExtratorNoticiasCore'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item '_news-src/engine' $dest -Recurse -Force
          Copy-Item '_news-src/node_modules' $dest -Recurse -Force
          Copy-Item '_news-src/package.json' $dest -Force
          Copy-Item '_news-src/monitor-bridge.js' $dest -Force
          Copy-Item (Get-Command node).Source (Join-Path $dest 'node.exe') -Force

      - name: Install Video core
        shell: pwsh
        run: |
          $root = 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $bridge = Get-ChildItem '_video-core' -Recurse -Filter 'VideoCoreBridge.exe' | Select-Object -First 1
          if (-not $bridge) { throw 'Video core não localizado.' }
          $dest = Join-Path $root 'tools/ExtratorVideosCore'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $bridge.Directory.FullName '*') $dest -Recurse -Force

      - name: Test direct ffprobe timeline import path
        shell: pwsh
        run: |
          $root = Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $video = Join-Path $root 'tools/ExtratorVideosCore'
          $ffmpeg = Join-Path $video 'bin/ffmpeg.exe'
          $ffprobe = Join-Path $video 'bin/ffprobe.exe'
          if (-not (Test-Path $ffprobe)) { throw 'ffprobe.exe ausente no Portable.' }
          & $ffmpeg -y -f lavfi -i color=c=black:s=640x360:d=2 -f lavfi -i anullsrc=r=44100:cl=stereo -shortest -c:v libx264 -c:a aac 'timeline-import-smoke.mp4'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar vídeo de teste.' }
          $json = & $ffprobe -v error -show_entries 'format=duration:stream=codec_type,width,height,r_frame_rate' -of json 'timeline-import-smoke.mp4' | Out-String
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($json)) { throw 'ffprobe direto falhou.' }
          $data = $json | ConvertFrom-Json
          $duration = [double]$data.format.duration
          $videoStream = $data.streams | Where-Object { $_.codec_type -eq 'video' } | Select-Object -First 1
          if ($duration -le 0) { throw 'Duração não identificada pelo caminho direto.' }
          if (-not $videoStream -or [int]$videoStream.width -ne 640 -or [int]$videoStream.height -ne 360) { throw 'Metadados do vídeo não foram identificados pelo caminho direto.' }
          Write-Host "PASS: caminho de importação direto via ffprobe retornou duração=$duration e 640x360."

      - name: Verify integrated cores
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          $root = Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $news = Join-Path $root 'tools/ExtratorNoticiasCore'
          $newsRaw = ('{"action":"state"}' | & (Join-Path $news 'node.exe') (Join-Path $news 'monitor-bridge.js')) | Out-String
          if ($newsRaw -notmatch '1\.25\.19') { throw 'Extrator de Notícias integrado regrediu.' }
          $video = Join-Path $root 'tools/ExtratorVideosCore'
          $videoRaw = ('{"action":"state"}' | & (Join-Path $video 'VideoCoreBridge.exe')) | Out-String
          if ($videoRaw -notmatch 'Windows Portable v3\.0\.1') { throw 'Extrator de Vídeos regrediu.' }
          if ($videoRaw -notmatch '"ffmpeg": true' -or $videoRaw -notmatch '"ffprobe": true') { throw 'FFmpeg/FFprobe não disponíveis.' }

      - name: Test real editor export
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          $root = Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $video = Join-Path $root 'tools/ExtratorVideosCore'
          $bridge = Join-Path $video 'VideoCoreBridge.exe'
          $probeReq = @{ action='probe'; path=(Resolve-Path 'timeline-import-smoke.mp4').Path } | ConvertTo-Json -Compress
          $probeLines = $probeReq | & $bridge
          $probeResult = $probeLines | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } | Where-Object { $_.type -eq 'result' } | Select-Object -Last 1
          if (-not $probeResult.ok) { throw "Probe bridge falhou: $($probeResult.error)" }
          $info = $probeResult.info
          $clip = @{ path=(Resolve-Path 'timeline-import-smoke.mp4').Path; start_ms=0; end_ms=[int64]$info.duration_ms; duration_ms=[int64]$info.duration_ms; cut_before=$false; info=$info }
          $req = @{ action='export'; clips=@($clip); outputName='timeline-import-export.mp4'; resolution='Original'; codec='H.264 / AVC'; targetSizeEnabled=$false; targetSizeMb=30 } | ConvertTo-Json -Depth 8 -Compress
          $lines = $req | & $bridge
          $result = $lines | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } | Where-Object { $_.type -eq 'result' } | Select-Object -Last 1
          if (-not $result.ok) { throw "Exportação real falhou: $($result.error)" }
          Write-Host 'PASS: exportação H.264 real concluída.'

      - name: UI navigation freeze smoke test
        shell: pwsh
        run: |
          $root = Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $exe = Join-Path $root 'MonitorDeNoticias.exe'
          $smoke = Join-Path $env:RUNNER_TEMP 'editor-smoke.txt'
          $env:MONITOR_EDITOR_SMOKE_FILE = $smoke
          $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          $deadline = (Get-Date).AddSeconds(18)
          do {
            Start-Sleep -Milliseconds 500
            if (Test-Path $smoke) { $state = (Get-Content $smoke -Raw).Trim() } else { $state = '' }
            if ($state -eq 'PASS') { break }
            if ($p.HasExited) { throw "Monitor encerrou durante navegação. Exit=$($p.ExitCode), estado=$state" }
          } while ((Get-Date) -lt $deadline)
          if ($state -ne 'PASS') { throw "Editor/navigation smoke travou ou expirou. Estado: $state" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'PASS: Editor -> Extrator -> Editor -> Início sem congelamento.'

      - name: Create RC2 ZIP
        shell: pwsh
        run: |
          $root = Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $zip = Join-Path $PWD 'Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 150000000) { throw 'ZIP final parece incompleto.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2.zip" | Set-Content 'Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2.zip.sha256'
          Write-Host "SHA256: $hash"

      - name: Publish RC2 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v4.0.2-editor-separated-rc2'
          if (gh release view $tag --repo tysudess/noticias-monitor 2>$null) { gh release delete $tag --repo tysudess/noticias-monitor --yes --cleanup-tag }
          gh release create $tag 'Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2.zip' 'Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2.zip.sha256' --repo tysudess/noticias-monitor --target integration/video-editor-separated-v1 --title 'Monitor de Notícias v4.0.2 — Editor Timeline RC2' --prerelease --notes 'RC2 corrige a importação de vídeos para a timeline. O Editor agora lê duração/resolução/FPS/áudio diretamente pelo ffprobe.exe incluído no Portable, sem depender do probe do bridge para criar o clipe. Extrator de Notícias e Extrator de Vídeos preservados. Testes: compilação, ffprobe direto em vídeo sintético, núcleos integrados, exportação H.264 real e navegação Editor -> Extrator -> Editor -> Início sem congelamento. A main não foi alterada.'

      - name: Upload RC2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2
          path: |
            Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2.zip
            Monitor-de-Noticias-v4.0.2-EDITOR-SEPARADO-RC2.zip.sha256
          retention-days: 7
