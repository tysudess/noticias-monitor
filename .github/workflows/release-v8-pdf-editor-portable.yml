name: Release V8 PDF Editor V2 Portable

on:
  push:
    branches:
      - work/v8-next
    paths:
      - '.github/workflows/release-v8-pdf-editor-portable.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-next
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Windows portable
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $root = 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          if (-not (Test-Path $root)) { throw 'Portable não foi gerado.' }
          $exe = Join-Path $root 'MonitorDeNoticias.exe'
          if (-not (Test-Path $exe)) { throw 'MonitorDeNoticias.exe ausente.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'data') | Out-Null
          $zipName = 'Monitor-de-Noticias-V8-Editor-PDF-V2-Windows-Portable.zip'
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zipName -CompressionLevel Optimal
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content "$zipName.sha256"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v8-pdf-editor-layout-v2-20260911'
          if (gh release view $tag --repo tysudess/noticias-monitor 2>$null) {
            gh release delete $tag --repo tysudess/noticias-monitor --yes --cleanup-tag
          }
          gh release create $tag `
            'Monitor-de-Noticias-V8-Editor-PDF-V2-Windows-Portable.zip' `
            'Monitor-de-Noticias-V8-Editor-PDF-V2-Windows-Portable.zip.sha256' `
            --repo tysudess/noticias-monitor `
            --target work/v8-next `
            --title 'Monitor de Notícias V8 + Editor de PDF V2 — Windows Portable' `
            --notes 'Editor de PDF V2 com layout baseado na referência fornecida, botão Selecionar corte, correção de recorte e capa padrão Mídia Impressa embutida.'
