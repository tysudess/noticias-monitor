name: Release V8 + Extrator de Vídeos v3.0.1 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - work/v8-extrator-v301-tab
    paths:
      - 'desktop/build.gradle.kts'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoScreen.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoEngine.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorPortableStateStore.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/YouTubeLiveSnapshot.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/GloboplaySessionStore.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/GloboplayHtmlFallback.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/GloboplayLoginWindow.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/R7HtmlFallback.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DirectMediaHtmlFallback.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/HiddenWindowsProcess.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/YtDlpUpdater.kt'
      - 'tools/integrate-v8-extractor-tab.py'
      - 'tools/patch-extractor-generic-html.py'
      - 'tools/patch-extractor-live-current-point.py'
      - 'tools/patch-extractor-youtube-live-status.py'
      - 'tools/patch-extractor-portable-state.py'
      - 'tools/patch-extractor-compat-retry.py'
      - 'tools/patch-extractor-r7-reference.py'
      - 'tools/patch-extractor-portable-paths.py'
      - 'tools/patch-extractor-dedicated-workspace.py'
      - 'tools/patch-extractor-hidden-process.py'
      - '.github/workflows/release-v8-extractor-tab-portable.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/v8-extrator-v301-tab
          fetch-depth: 0

      - name: Registrar hash do Editor PDF aprovado
        shell: pwsh
        run: |
          $hash=(Get-FileHash 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt' -Algorithm SHA256).Hash
          "PDF_HASH=$hash" | Out-File $env:GITHUB_ENV -Append
          Write-Host "PDF aprovado: $hash"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar integração completa do Extrator
        shell: pwsh
        run: |
          python tools/integrate-v8-extractor-tab.py
          python tools/patch-extractor-generic-html.py
          python tools/patch-extractor-hidden-process.py

      - name: Garantir que Editor PDF não mudou
        shell: pwsh
        run: |
          $after=(Get-FileHash 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt' -Algorithm SHA256).Hash
          if ($after -ne $env:PDF_HASH) { throw 'PdfEditorScreenV2.kt foi alterado. Release bloqueado.' }
          if (git diff --name-only | Select-String -SimpleMatch 'PdfEditorScreenV2.kt') { throw 'Editor PDF apareceu no diff. Release bloqueado.' }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar Desktop
        shell: pwsh
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Criar distribuição Windows
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Preparar binários do Extrator
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          New-Item -ItemType Directory -Force -Path 'extractor-bin' | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe' -OutFile 'extractor-bin/yt-dlp.exe' -TimeoutSec 180
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'extractor-bin/yt-dlp-stable.exe' -TimeoutSec 180
          Invoke-WebRequest -Uri 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile 'deno.zip' -TimeoutSec 180
          Expand-Archive 'deno.zip' 'deno-temp' -Force
          Copy-Item 'deno-temp/deno.exe' 'extractor-bin/deno.exe' -Force

          $ffSources=@(
            'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n9.0-latest-win64-gpl-9.0.zip',
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          )
          $ok=$false
          foreach($source in $ffSources){
            try{
              Invoke-WebRequest -Uri $source -OutFile 'ffmpeg.zip' -TimeoutSec 240
              if((Get-Item 'ffmpeg.zip').Length -gt 1000000){$ok=$true;break}
            } catch { Write-Warning $_.Exception.Message }
          }
          if(-not $ok){throw 'Não foi possível baixar FFmpeg.'}
          Expand-Archive 'ffmpeg.zip' 'ffmpeg-temp' -Force
          $ffmpeg=Get-ChildItem 'ffmpeg-temp' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe=Get-ChildItem 'ffmpeg-temp' -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if(-not $ffmpeg -or -not $ffprobe){throw 'ffmpeg/ffprobe ausentes.'}
          Copy-Item $ffmpeg.FullName 'extractor-bin/ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName 'extractor-bin/ffprobe.exe' -Force

          & 'extractor-bin/yt-dlp.exe' --version
          if($LASTEXITCODE -ne 0){throw 'yt-dlp nightly inválido.'}
          & 'extractor-bin/yt-dlp-stable.exe' --version
          if($LASTEXITCODE -ne 0){throw 'yt-dlp stable inválido.'}
          & 'extractor-bin/deno.exe' --version
          if($LASTEXITCODE -ne 0){throw 'Deno inválido.'}
          & 'extractor-bin/ffmpeg.exe' -version | Select-Object -First 1
          if($LASTEXITCODE -ne 0){throw 'FFmpeg inválido.'}
          & 'extractor-bin/ffprobe.exe' -version | Select-Object -First 1
          if($LASTEXITCODE -ne 0){throw 'FFprobe inválido.'}

      - name: Montar Monitor Portable com Extrator
        shell: pwsh
        run: |
          $root='desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          if(-not (Test-Path $root)){throw 'Distribuição Windows não foi gerada.'}
          if(-not (Test-Path (Join-Path $root 'MonitorDeNoticias.exe'))){throw 'MonitorDeNoticias.exe ausente.'}
          $bin=Join-Path $root 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          foreach($name in @('yt-dlp.exe','yt-dlp-stable.exe','ffmpeg.exe','ffprobe.exe','deno.exe')){
            Copy-Item (Join-Path 'extractor-bin' $name) (Join-Path $bin $name) -Force
            $path=Join-Path $bin $name
            if(-not (Test-Path $path) -or (Get-Item $path).Length -lt 100000){throw "Binário inválido no portable: $name"}
          }
          New-Item -ItemType Directory -Force (Join-Path $root 'Videos') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $root 'data/extractor') | Out-Null

      - name: Validar contrato do Extrator
        shell: pwsh
        run: |
          $dash=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt' -Raw
          $screen=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoScreen.kt' -Raw
          $engine=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoEngine.kt' -Raw
          $live=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/YouTubeLiveSnapshot.kt' -Raw
          $state=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorPortableStateStore.kt' -Raw
          $login=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/GloboplayLoginWindow.kt' -Raw
          $session=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/GloboplaySessionStore.kt' -Raw
          $r7=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/R7HtmlFallback.kt' -Raw
          $generic=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DirectMediaHtmlFallback.kt' -Raw
          $hidden=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/HiddenWindowsProcess.kt' -Raw
          $updater=Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/YtDlpUpdater.kt' -Raw

          if($dash -notmatch 'EXTRACTOR\("Extrator de Vídeos"'){throw 'Aba Extrator ausente.'}
          if($dash -notmatch 'else if \(section == V5Section.EXTRACTOR\)'){throw 'Extrator não está em workspace dedicada.'}
          if($dash -notmatch 'ExtractorVideoScreen \{ section = V5Section.HOME \}'){throw 'Workspace dedicada do Extrator ausente.'}
          if($screen -match 'ANALISAR'){throw 'ANALISAR não pode ficar visível.'}
          foreach($q in @('360p','480p','720p HD','1080p Full HD','Melhor disponível')){if(($screen+$engine) -notmatch [regex]::Escape($q)){throw "Qualidade ausente: $q"}}
          foreach($x in @('Formato de saída: MP4','↓  BAIXAR VÍDEO','LOGIN GLOBOPLAY','ATUALIZAR YT-DLP','APAGAR SESSÃO','LIMPAR HISTÓRICO','SALVAR PROXY','REMOVER PROXY','ExtractorPortableStateStore')){if($screen -notmatch [regex]::Escape($x)){throw "UI/estado ausente: $x"}}
          foreach($x in @('YouTubeLiveSnapshot.download','--download-sections','runYtDlpQuality','quality.compat','libx264','veryfast','yuv420p','160k','+faststart','yt-dlp-stable.exe','--force-ipv4','--ignore-config','--no-mtime','m3u8:native','GloboplayHtmlFallback.extractM3u8Candidates','R7HtmlFallback.extractMediaCandidates','DirectMediaHtmlFallback.extractCandidates','createRuntimeCookieFile','HiddenWindowsProcess.start','HiddenWindowsProcess.destroyTree','jpackage.app-path','MonitorDeNoticias.exe','val r7Base = listOf("--force-ipv4", "--no-mtime")')){if($engine -notmatch [regex]::Escape($x)){throw "Motor incompleto: $x"}}
          if($engine -match 'liveStatus == "post_live"'){throw 'post_live não pode ser tratado como live ativa.'}
          foreach($x in @('#EXT-X-ENDLIST','protocol_whitelist','durationSeconds','libx264','160k')){if($live -notmatch [regex]::Escape($x)){throw "Snapshot HLS incompleto: $x"}}
          foreach($x in @('history.txt','settings.properties','proxy.dpapi','ProtectedData','CurrentUser','loadHistory','saveQualityIndex','saveProxy','[Console]::In.ReadToEnd()','stdinText')){if($state -notmatch [regex]::Escape($x)){throw "Persistência portable incompleta: $x"}}
          if($r7 -notmatch 'take\(15\)'){throw 'R7 sem limite 15.'}
          if($generic -notmatch 'take\(15\)'){throw 'Fallback genérico sem limite 15.'}
          foreach($x in @('-WindowStyle','Hidden','taskkill.exe','/T','/F')){if($hidden -notmatch [regex]::Escape($x)){throw "Launcher oculto incompleto: $x"}}
          foreach($x in @('ABRIR GLOBOPLAY','SALVAR SESSÃO E VOLTAR','FECHAR','WebView')){if($login -notmatch [regex]::Escape($x)){throw "Login interno incompleto: $x"}}
          foreach($x in @('ProtectedData','CurrentUser','globoplay.session.dpapi','HiddenWindowsProcess.start','[Console]::In.ReadToEnd()','stdinText')){if($session -notmatch [regex]::Escape($x)){throw "Sessão segura incompleta: $x"}}
          foreach($x in @('ATOMIC_MOVE','yt-dlp.backup.exe','--version','HiddenWindowsProcess.start','Intencionalmente NÃO apagamos backup aqui')){if($updater -notmatch [regex]::Escape($x)){throw "Updater incompleto: $x"}}

      - name: Criar ZIP e SHA256
        shell: pwsh
        run: |
          $root=Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $zipName='Monitor-de-Noticias-V8-Extrator-Videos-v3.0.1-Windows-Portable.zip'
          if(Test-Path $zipName){Remove-Item $zipName -Force}
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zipName -CompressionLevel Optimal
          if((Get-Item $zipName).Length -lt 1000000){throw 'ZIP final parece incompleto.'}
          $hash=(Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content "$zipName.sha256"
          Write-Host "SHA256=$hash"

      - name: Publicar release de teste
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v8-extrator-videos-v301-preview'
          $zip='Monitor-de-Noticias-V8-Extrator-Videos-v3.0.1-Windows-Portable.zip'
          $sha='Monitor-de-Noticias-V8-Extrator-Videos-v3.0.1-Windows-Portable.zip.sha256'
          $notes='Preview completa: Extrator como workspace interna do Monitor, cinco binários portáteis, subprocessos ocultos, YouTube Live com snapshot HLS congelado e fallback até o ponto do clique, H.264, seletores compatíveis, R7/Record com IPv4/no-mtime e fallback de candidatos, histórico/configurações portáteis, proxy e sessão Globoplay protegidos por DPAPI via stdin, login oficial interno, HLS/m3u8 e atualizador seguro do yt-dlp com preservação de backup. Editor de PDF protegido e inalterado.'
          if(gh release view $tag --repo tysudess/noticias-monitor 2>$null){
            gh release upload $tag $zip $sha --repo tysudess/noticias-monitor --clobber
            if($LASTEXITCODE -ne 0){throw 'Falha ao substituir assets da preview; release anterior foi preservada.'}
            gh release edit $tag --repo tysudess/noticias-monitor --target work/v8-extrator-v301-tab --prerelease --title 'Monitor V8 + Extrator de Vídeos v3.0.1 — Preview Portable' --notes $notes
          } else {
            gh release create $tag $zip $sha --repo tysudess/noticias-monitor --target work/v8-extrator-v301-tab --prerelease --title 'Monitor V8 + Extrator de Vídeos v3.0.1 — Preview Portable' --notes $notes
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-de-Noticias-V8-Extrator-Videos-v3.0.1-Windows-Portable
          path: |
            Monitor-de-Noticias-V8-Extrator-Videos-v3.0.1-Windows-Portable.zip
            Monitor-de-Noticias-V8-Extrator-Videos-v3.0.1-Windows-Portable.zip.sha256
          retention-days: 14
