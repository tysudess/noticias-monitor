name: Integrar Extrator v3.0.1 como aba do Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - work/v8-extrator-v301-tab
    paths:
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoScreen.kt'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoEngine.kt'
      - 'tools/integrate-v8-extractor-tab.py'
      - '.github/workflows/integrate-v8-extractor-tab.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/v8-extrator-v301-tab
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Registrar hash do Editor PDF aprovado
        shell: powershell
        run: |
          $hash = (Get-FileHash 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt' -Algorithm SHA256).Hash
          "PDF_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PDF aprovado: $hash"

      - name: Integrar aba Extrator
        run: python tools/integrate-v8-extractor-tab.py

      - name: Normalizar módulo do motor
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path(r'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoEngine.kt'); s=p.read_text(encoding='utf-8'); s=s.replace(chr(34)+'$1://***:***@'+chr(34), chr(34)+'\\$1://***:***@'+chr(34)); p.write_text(s, encoding='utf-8')"

      - name: Garantir que Editor PDF não mudou
        shell: powershell
        run: |
          $after = (Get-FileHash 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt' -Algorithm SHA256).Hash
          if ($after -ne $env:PDF_HASH) { throw 'PdfEditorScreenV2.kt foi alterado. Build bloqueado.' }
          if (git diff --name-only | Select-String -SimpleMatch 'PdfEditorScreenV2.kt') { throw 'Editor PDF apareceu no diff. Build bloqueado.' }

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar Desktop
        shell: powershell
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Testes estruturais da aba
        shell: powershell
        run: |
          $dash = Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt' -Raw
          $ext = Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoScreen.kt' -Raw
          $engine = Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoEngine.kt' -Raw
          if ($dash -notmatch 'EXTRACTOR\("Extrator de Vídeos"') { throw 'Item Extrator ausente da sidebar.' }
          if ($dash -notmatch 'V5Section.EXTRACTOR -> ExtractorVideoScreen') { throw 'Rota da aba Extrator ausente.' }
          foreach ($q in @('360p','480p','720p HD','1080p Full HD','Melhor disponível')) {
            if (($ext + $engine) -notmatch [regex]::Escape($q)) { throw "Qualidade ausente: $q" }
          }
          if ($ext -match 'ANALISAR') { throw 'Fluxo final não pode exibir ANALISAR.' }
          if ($ext -notmatch 'Formato de saída: MP4') { throw 'Texto de formato ausente.' }
          foreach ($required in @('--live-from-start','ffprobe','libx264','veryfast','yuv420p','160k','+faststart','yt-dlp-stable.exe','--force-ipv4','--ignore-config','--no-mtime')) {
            if ($engine -notmatch [regex]::Escape($required)) { throw "Motor v3.0.1 incompleto: $required" }
          }
          Write-Host 'Estrutura inicial e motor YouTube/H264 validados.'

      - name: Commitar integração gerada
        shell: powershell
        run: |
          if ((git status --porcelain).Length -eq 0) {
            Write-Host 'Nenhuma alteração gerada.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt desktop/src/main/kotlin/br/com/monitordenoticias/desktop/ExtractorVideoEngine.kt
          git commit -m 'Integrate extractor video tab and validate v3.0.1 engine'
          git push origin HEAD:work/v8-extrator-v301-tab
