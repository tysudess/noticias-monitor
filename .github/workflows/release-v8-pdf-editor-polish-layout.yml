          repl('private fun buildWorkspace():JComponent=JPanel(BorderLayout(8,0)).apply{background=V2_BG;border=EmptyBorder(10,10,8,10);add(buildLeftPanel(),BorderLayout.WEST);add(buildCenterPanel(),BorderLayout.CENTER);add(buildRightPanel(),BorderLayout.EAST)}',
