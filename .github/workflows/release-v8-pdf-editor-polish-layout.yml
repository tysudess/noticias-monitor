               'margem header esquerda')
          repl('preferredSize=Dimension(72,78)', 'preferredSize=Dimension(58,68)', 'tamanho icone pdf')
          repl('g2.fillRoundRect(8,3,48,68,8,8);g2.color=Color(31,132,255);g2.stroke=BasicStroke(3f);g2.drawRoundRect(8,3,48,68,8,8);g2.color=Color(238,57,61);g2.fillRoundRect(28,39,40,27,6,6);g2.color=Color.WHITE;g2.font=Font("SansSerif",Font.BOLD,14);g2.drawString("PDF",34,58)',
               'g2.fillRoundRect(6,4,42,58,8,8);g2.color=Color(31,132,255);g2.stroke=BasicStroke(2.4f);g2.drawRoundRect(6,4,42,58,8,8);g2.color=Color(238,57,61);g2.fillRoundRect(23,35,34,23,6,6);g2.color=Color.WHITE;g2.font=Font("SansSerif",Font.BOLD,12);g2.drawString("PDF",28,51)',
               'desenho icone pdf')
          repl('add(label("CENTRAL DE INTELIGÊNCIA DE MÍDIA",14f,Font.BOLD,Color(65,157,255)));add(label("Editor de PDF",30f,Font.BOLD,V2_TEXT));add(label("Monte, reorganize, recorte e exporte PDFs e imagens",15f,Font.PLAIN,V2_MUTED))',
               'add(label("CENTRAL DE INTELIGÊNCIA DE MÍDIA",13f,Font.BOLD,Color(65,157,255)));add(label("Editor de PDF",27f,Font.BOLD,V2_TEXT));add(label("Monte, reorganize, recorte e exporte PDFs e imagens",13f,Font.PLAIN,V2_MUTED))',
