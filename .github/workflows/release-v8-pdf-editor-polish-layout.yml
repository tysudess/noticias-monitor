name: Release V8 PDF Editor Polished Layout Portable

on:
  push:
    branches:
      - work/v8-next-a4-crop-fix
    paths:
      - '.github/workflows/release-v8-pdf-editor-polish-layout.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-next-a4-crop-fix
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply polished editor layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from pathlib import Path
          import re

          pdf_path = Path('desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt')
          src = pdf_path.read_text(encoding='utf-8')

          def repl(old, new, label):
              global src
              if old not in src:
                  raise SystemExit(f'Bloco não encontrado: {label}')
              src = src.replace(old, new, 1)

          # Mantem a qualidade/corte da versão anterior e refina a distribuição visual.
          repl('header.isOpaque=false; header.preferredSize=Dimension(1,112); header.border=BorderFactory.createMatteBorder(0,0,1,0,V2_BORDER_SOFT)',
               'header.isOpaque=false; header.preferredSize=Dimension(1,88); header.border=BorderFactory.createMatteBorder(0,0,1,0,V2_BORDER_SOFT)',
