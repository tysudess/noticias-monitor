          '@
          $script | python -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt
          git diff --cached --check
          git commit -m 'fix: polish PDF editor layout spacing'
          git push origin HEAD:work/v8-next-a4-crop-fix

      - name: Build Windows portable
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $root = 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          if (-not (Test-Path $root)) { throw 'Portable não foi gerado.' }
          $exe = Join-Path $root 'MonitorDeNoticias.exe'
          if (-not (Test-Path $exe)) { throw 'MonitorDeNoticias.exe ausente.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'data') | Out-Null
          $zipName = 'Monitor-de-Noticias-V8-Editor-PDF-V2-Layout-Refinado-Windows-Portable.zip'
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zipName -CompressionLevel Optimal
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content "$zipName.sha256"
          Write-Host "SHA256=$hash"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v8-pdf-editor-polished-layout-20260911'
          if (gh release view $tag --repo tysudess/noticias-monitor 2>$null) {
            gh release delete $tag --repo tysudess/noticias-monitor --yes --cleanup-tag
          }
          gh release create $tag `
            'Monitor-de-Noticias-V8-Editor-PDF-V2-Layout-Refinado-Windows-Portable.zip' `
            'Monitor-de-Noticias-V8-Editor-PDF-V2-Layout-Refinado-Windows-Portable.zip.sha256' `
            --repo tysudess/noticias-monitor `
            --target work/v8-next-a4-crop-fix `
            --title 'Monitor de Notícias V8 + Editor PDF V2 Layout Refinado — Windows Portable' `
            --notes 'Refino minucioso do layout do Editor de PDF: lateral interna compacta e sem textos cortados, header/footer menores, coluna de páginas mais fina, painel direito mais contido e mais espaço para visualização/edição A4. Mantém as correções anteriores de corte real e exportação sem perda para capa/imagens.'