          repl('label("☁",28f,Font.BOLD,Color(153,195,239)),label("Arraste imagens",12f,Font.PLAIN,Color(202,219,238)),label("ou PDFs aqui",12f,Font.PLAIN,Color(202,219,238)),label("ou clique para selecionar",10f,Font.PLAIN,V2_MUTED)',
               'label("☁",24f,Font.BOLD,Color(153,195,239)),label("Arraste",11f,Font.PLAIN,Color(202,219,238)),label("PDF/imagem",11f,Font.PLAIN,Color(202,219,238)),label("ou selecione",9.5f,Font.PLAIN,V2_MUTED)',
               'texto drop menor')
          repl('maximumSize=Dimension(202,34)', 'maximumSize=Dimension(164,32)', 'botao drop menor')
          repl('blueButton("Selecionar arquivos")', 'blueButton("Selecionar")', 'texto botao drop')

          repl('border = EmptyBorder(12, 13, 12, 13)', 'border = EmptyBorder(9, 9, 9, 9)', 'padding painel central')
          repl('val body = JPanel(BorderLayout(6, 0)).apply { isOpaque = false }', 'val body = JPanel(BorderLayout(5, 0)).apply { isOpaque = false }', 'gap central')
          repl('preferredSize = Dimension(112, 1)\n            minimumSize = Dimension(104, 320)', 'preferredSize = Dimension(96, 1)\n            minimumSize = Dimension(90, 320)', 'coluna paginas mais fina')
          repl('th.add(label("▦  Páginas", 14f, Font.BOLD, V2_TEXT), BorderLayout.WEST)', 'th.add(label("▦", 14f, Font.BOLD, V2_TEXT), BorderLayout.WEST)', 'titulo paginas curto')
          repl('preview.minimumSize = Dimension(620, 640)', 'preview.minimumSize = Dimension(720, 660)', 'preview maior')
          repl('controls.add(Box.createHorizontalStrut(28))', 'controls.add(Box.createHorizontalStrut(12))', 'controles mais juntos')
          repl('zoomLabel.preferredSize = Dimension(58, 36)', 'zoomLabel.preferredSize = Dimension(50, 34)', 'zoom menor')

          repl('val p=RoundedPanel(16,V2_BG_2,V2_BORDER_SOFT).apply{layout=BoxLayout(this,BoxLayout.Y_AXIS);border=EmptyBorder(12,10,12,10);preferredSize=Dimension(260,1);minimumSize=Dimension(250,1)}',
               'val p=RoundedPanel(16,V2_BG_2,V2_BORDER_SOFT).apply{layout=BoxLayout(this,BoxLayout.Y_AXIS);border=EmptyBorder(10,8,10,8);preferredSize=Dimension(244,1);minimumSize=Dimension(236,1)}',
               'painel direito refinado')
          repl('maximumSize=Dimension(Int.MAX_VALUE,178);preferredSize=Dimension(235,178)', 'maximumSize=Dimension(Int.MAX_VALUE,168);preferredSize=Dimension(222,168)', 'preview capa mais contido')
          repl('val s=min(218.0/img.width,164.0/img.height);coverPreview.icon=ImageIcon(img.getScaledInstance(max(1,(img.width*s).roundToInt()),max(1,(img.height*s).roundToInt()),Image.SCALE_SMOOTH))',
               'val s=min(205.0/img.width,154.0/img.height);coverPreview.icon=ImageIcon(img.getScaledInstance(max(1,(img.width*s).roundToInt()),max(1,(img.height*s).roundToInt()),Image.SCALE_SMOOTH))',
               'preview capa escala')
          repl('private fun buildFooter():JComponent=JPanel(BorderLayout()).apply{background=Color(4,19,35);preferredSize=Dimension(1,42);border=BorderFactory.createMatteBorder(1,0,0,0,V2_BORDER_SOFT);add(label("Central de Inteligência de Mídia   |   Editor de PDF",11f,Font.PLAIN,Color(161,185,211)).apply{border=EmptyBorder(0,28,0,0)},BorderLayout.WEST);add(label("ϟ  Mais produtividade para o seu conteúdo",11f,Font.PLAIN,Color(170,196,224)).apply{border=EmptyBorder(0,0,0,28)},BorderLayout.EAST)}',
               'private fun buildFooter():JComponent=JPanel(BorderLayout()).apply{background=Color(4,19,35);preferredSize=Dimension(1,30);border=BorderFactory.createMatteBorder(1,0,0,0,V2_BORDER_SOFT);add(label("Central de Inteligência de Mídia   |   Editor de PDF",10.5f,Font.PLAIN,Color(161,185,211)).apply{border=EmptyBorder(0,18,0,0)},BorderLayout.WEST);add(label("ϟ  Mais produtividade",10.5f,Font.PLAIN,Color(170,196,224)).apply{border=EmptyBorder(0,0,0,18)},BorderLayout.EAST)}',
               'footer menor')

          repl('private fun configureThumbList(){thumbList.layoutOrientation=JList.VERTICAL;thumbList.visibleRowCount=-1;thumbList.fixedCellWidth=88;thumbList.fixedCellHeight=126;thumbList.background=Color(8,28,48);thumbList.selectionMode=ListSelectionModel.SINGLE_SELECTION;thumbList.cellRenderer=PdfV2ThumbnailRenderer();thumbList.dragEnabled=true;thumbList.dropMode=DropMode.INSERT;thumbList.transferHandler=PdfV2ReorderTransferHandler();thumbList.addListSelectionListener{if(!it.valueIsAdjusting)refreshPreview()}}',
               'private fun configureThumbList(){thumbList.layoutOrientation=JList.VERTICAL;thumbList.visibleRowCount=-1;thumbList.fixedCellWidth=72;thumbList.fixedCellHeight=112;thumbList.background=Color(8,28,48);thumbList.selectionMode=ListSelectionModel.SINGLE_SELECTION;thumbList.cellRenderer=PdfV2ThumbnailRenderer();thumbList.dragEnabled=true;thumbList.dropMode=DropMode.INSERT;thumbList.transferHandler=PdfV2ReorderTransferHandler();thumbList.addListSelectionListener{if(!it.valueIsAdjusting)refreshPreview()}}',
               'lista miniaturas refinada')
          repl('private fun setThumbMode(t:Boolean){thumbList.layoutOrientation=JList.VERTICAL;thumbList.visibleRowCount=-1;if(t){thumbList.fixedCellWidth=88;thumbList.fixedCellHeight=126}else{thumbList.fixedCellWidth=-1;thumbList.fixedCellHeight=58};thumbList.revalidate();thumbList.repaint()}',
               'private fun setThumbMode(t:Boolean){thumbList.layoutOrientation=JList.VERTICAL;thumbList.visibleRowCount=-1;if(t){thumbList.fixedCellWidth=72;thumbList.fixedCellHeight=112}else{thumbList.fixedCellWidth=-1;thumbList.fixedCellHeight=52};thumbList.revalidate();thumbList.repaint()}',
               'modo miniatura refinado')
          repl('private fun createThumbnail(page:PdfV2Page):ImageIcon{val src=renderFinalPage(page,58);val s=min(70.0/src.width,98.0/src.height).coerceAtMost(1.0);return ImageIcon(src.getScaledInstance(max(1,(src.width*s).roundToInt()),max(1,(src.height*s).roundToInt()),Image.SCALE_SMOOTH))}',
