name: Release Monitor V8 Dashboard Stable

on:
  push:
    branches:
      - release/v8-dashboard-stable
    paths:
      - '.github/workflows/release-v8-dashboard-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout frozen V8 release branch
        uses: actions/checkout@v4
        with:
          ref: release/v8-dashboard-stable
          fetch-depth: 0

      - name: Verify V8 baseline is untouched
        shell: pwsh
        run: |
          $baseline = '297ca0bff3b3d2c87a811aab679dca89c9bef66a'
          git merge-base --is-ancestor $baseline HEAD
          if ($LASTEXITCODE -ne 0) { throw 'A branch de release não deriva da baseline V8 esperada.' }

          $allowed = '.github/workflows/release-v8-dashboard-stable.yml'
          $changed = @(git diff --name-only "$baseline..HEAD")
          $unexpected = @($changed | Where-Object { $_ -and $_ -ne $allowed })
          if ($unexpected.Count -gt 0) {
            Write-Host 'Arquivos inesperados alterados após a baseline V8:'
            $unexpected | ForEach-Object { Write-Host " - $_" }
            throw 'Código funcional da V8 foi alterado; release abortado.'
          }
          Write-Host 'PASS: código funcional idêntico à baseline V8 compact-before-extractors.'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile V8
        shell: pwsh
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Create Windows Portable distributable
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Verify package is V8 without integrated extractors
        shell: pwsh
        run: |
          $root = 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          if (-not (Test-Path $root)) { throw 'Distribuição Windows não foi gerada.' }
          $exe = Join-Path $root 'MonitorDeNoticias.exe'
          if (-not (Test-Path $exe)) { throw 'MonitorDeNoticias.exe ausente.' }

          $forbidden = @(
            (Join-Path $root 'tools/ExtratorNoticiasCore'),
            (Join-Path $root 'tools/ExtratorVideosCore'),
            (Join-Path $root 'tools/VideoCoreBridge.exe')
          )
          foreach ($path in $forbidden) {
            if (Test-Path $path) { throw "Componente de extrator encontrado no pacote: $path" }
          }
          Write-Host 'PASS: Portable V8 gerado sem núcleos de extrator integrados.'

      - name: Create stable ZIP and SHA256
        shell: pwsh
        run: |
          $root = Resolve-Path 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          $zipName = 'Monitor-de-Noticias-V8-DASHBOARD-ESTAVEL-WINDOWS.zip'
          $zip = Join-Path $PWD $zipName
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 1000000) { throw 'ZIP final parece incompleto.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content "$zipName.sha256"
          Write-Host "SHA256: $hash"

      - name: Publish stable V8 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v8-dashboard-stable'
          if (gh release view $tag --repo tysudess/noticias-monitor 2>$null) {
            throw "O release/tag $tag já existe. Nenhum release existente será sobrescrito."
          }

          gh release create $tag `
            'Monitor-de-Noticias-V8-DASHBOARD-ESTAVEL-WINDOWS.zip' `
            'Monitor-de-Noticias-V8-DASHBOARD-ESTAVEL-WINDOWS.zip.sha256' `
            --repo tysudess/noticias-monitor `
            --target release/v8-dashboard-stable `
            --title 'Monitor de Notícias — V8 Dashboard Estável' `
            --notes 'Versão V8 Dashboard estável recuperada da baseline baseline/v8-compact-before-extractors (commit 297ca0bff3b3d2c87a811aab679dca89c9bef66a). Código funcional preservado sem alterações. Release Windows Portable sem núcleos de extrator integrados. Inclui arquivo SHA-256 para verificação de integridade.'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-de-Noticias-V8-DASHBOARD-ESTAVEL-WINDOWS
          path: |
            Monitor-de-Noticias-V8-DASHBOARD-ESTAVEL-WINDOWS.zip
            Monitor-de-Noticias-V8-DASHBOARD-ESTAVEL-WINDOWS.zip.sha256
          retention-days: 14
