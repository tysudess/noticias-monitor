name: Apply V6 desktop refinement

on:
  push:
    branches:
      - ui/dashboard-match
    paths:
      - tools/apply-v6-updates.py
      - .github/workflows/apply-v6-refinement.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/dashboard-match
          fetch-depth: 0

      - name: Apply V6 updates
        run: python tools/apply-v6-updates.py

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          git commit -m "feat(desktop): refine video search, readability, stop controls and icon"
          git push origin HEAD:ui/dashboard-match
