name: Apply news extractor tab

on:
  push:
    branches:
      - integration/extractors-v1
    paths:
      - tools/apply-news-extractor-tab.py
      - .github/workflows/apply-news-extractor-tab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/extractors-v1
          fetch-depth: 0

      - name: Apply tab wiring
        run: python tools/apply-news-extractor-tab.py

      - name: Commit dashboard wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat(integration): add Extrator de Notícias tab"
          git push origin HEAD:integration/extractors-v1
