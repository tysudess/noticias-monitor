name: Release V8 PDF Editor Capa HD Layout Final

on:
  push:
    branches:
      - work/v8-pdf-quality-ui-final
    paths:
      - '.github/workflows/release-v8-pdf-editor-capa-hd-ui-final.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-pdf-quality-ui-final
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply final cover quality and sidebar spacing fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .ci/apply-pdf-capa-hd-ui-final.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt
          git diff --cached --check
          git commit -m 'fix: improve PDF cover quality and sidebar spacing'
          git push origin HEAD:work/v8-pdf-quality-ui-final

      - name: Build Windows portable
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $root = 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          if (-not (Test-Path $root)) { throw 'Portable não foi gerado.' }
          $exe = Join-Path $root 'MonitorDeNoticias.exe'
          if (-not (Test-Path $exe)) { throw 'MonitorDeNoticias.exe ausente.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'data') | Out-Null
          $zipName = 'Monitor-de-Noticias-V8-Editor-PDF-Capa-HD-Layout-Final-Windows-Portable.zip'
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zipName -CompressionLevel Optimal
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content "$zipName.sha256"
          Write-Host "SHA256=$hash"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v8-pdf-editor-capa-hd-layout-final-20260911'
          if (gh release view $tag --repo tysudess/noticias-monitor 2>$null) {
            gh release delete $tag --repo tysudess/noticias-monitor --yes --cleanup-tag
          }
          gh release create $tag `
            'Monitor-de-Noticias-V8-Editor-PDF-Capa-HD-Layout-Final-Windows-Portable.zip' `
            'Monitor-de-Noticias-V8-Editor-PDF-Capa-HD-Layout-Final-Windows-Portable.zip.sha256' `
            --repo tysudess/noticias-monitor `
            --target work/v8-pdf-quality-ui-final `
            --title 'Monitor de Notícias V8 + Editor PDF Capa HD + Layout Final — Windows Portable' `
            --notes 'Correção aplicada no programa: capa padrão reconstruída/exportada em alta resolução interna, exportação sem perda mantida, lateral do editor mais justa sem espaço vazio perto dos ícones e preview A4 com mais área útil.'