name: Apply PDF Editor Layout Fix

on:
  push:
    branches:
      - work/v8-next
    paths:
      - '.github/workflows/apply-pdf-editor-layout-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-next
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply prepared code commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 2c07b4bf9200b365501668b2b40c9782787b23c6
          git cherry-pick 2c07b4bf9200b365501668b2b40c9782787b23c6

      - name: Validate compile
        shell: pwsh
        run: |
          gradle :desktop:compileKotlin --stacktrace

      - name: Push fix
        shell: pwsh
        run: |
          git push origin HEAD:work/v8-next
