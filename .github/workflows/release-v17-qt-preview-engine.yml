name: Release V17 Qt Preview Engine

on:
  push:
    branches:
      - work/v17-qt-preview-engine
    paths:
      - '.github/workflows/release-v17-qt-preview-engine.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v17-qt-preview-engine
          fetch-depth: 0

      - name: Validate proven-engine contract
        shell: pwsh
        run: |
          $hostSource = Get-Content 'desktop/src/main/python/video_preview_host.py' -Raw
          $controller = Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/QtEmbeddedVideoPreviewController.kt' -Raw
          $screen = Get-Content 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/VideoEditorScreen.kt' -Raw
          if ($hostSource -notmatch 'QMediaPlayer' -or $hostSource -notmatch 'QAudioOutput' -or $hostSource -notmatch 'QVideoWidget') { throw 'Motor Qt antigo não está preservado.' }
          if ($hostSource -notmatch 'setInterval\(55\)') { throw 'Timer de 55 ms do motor antigo ausente.' }
          if ($controller -notmatch 'video-preview-host/video-preview-host.exe') { throw 'Caminho onedir do host ausente.' }
          if ($screen -notmatch 'verticalScroll\(rememberScrollState\(\)\)') { throw 'Layout aprovado perdeu o scroll.' }
          if ($screen -notmatch 'height\(420\.dp\)') { throw 'Preview grande aprovado foi alterado.' }

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact legacy preview dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r video_preview_host/requirements.txt

      - name: Build Qt preview host using legacy onedir model
        shell: pwsh
        run: |
          python -m py_compile desktop/src/main/python/video_preview_host.py
          pyinstaller --noconfirm --clean --windowed --onedir --name video-preview-host --contents-directory _internal desktop/src/main/python/video_preview_host.py
          if (-not (Test-Path 'dist/video-preview-host/video-preview-host.exe')) { throw 'video-preview-host.exe não foi gerado.' }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Monitor with Qt bridge
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Rebuild full portable from validated V16
        shell: pwsh
        run: |
          $baseUrl = 'https://github.com/tysudess/noticias-monitor/releases/download/v16-video-preview-cursor-filename-20260912/Monitor-de-Noticias-V16-Editor-de-Video-Preview-Cursor-Nome-Windows-Portable.zip'
          Invoke-WebRequest -Uri $baseUrl -OutFile base.zip
          Expand-Archive base.zip -DestinationPath base -Force
          $newRoot = 'desktop/build/compose/binaries/main/app/MonitorDeNoticias'
          if (-not (Test-Path "$newRoot/MonitorDeNoticias.exe")) { throw 'Novo Monitor não foi gerado.' }
          Copy-Item "$newRoot/*" 'base' -Recurse -Force
          New-Item -ItemType Directory -Force -Path 'base/bin/video-preview-host' | Out-Null
          Copy-Item 'dist/video-preview-host/*' 'base/bin/video-preview-host' -Recurse -Force
          foreach ($required in @('MonitorDeNoticias.exe','bin/ffmpeg.exe','bin/ffprobe.exe','bin/video-preview-host/video-preview-host.exe')) {
            if (-not (Test-Path (Join-Path 'base' $required))) { throw "Portable incompleto: $required" }
          }

      - name: Smoke-test Qt host startup
        shell: pwsh
        run: |
          $exe = Resolve-Path 'base/bin/video-preview-host/video-preview-host.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "Qt preview host encerrou prematuramente com código $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force

      - name: Package and publish V17
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'Monitor-de-Noticias-V17-Editor-de-Video-Motor-Qt-Original-Windows-Portable.zip'
          Compress-Archive -Path 'base/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          $tag = 'v17-video-editor-qt-original-engine-20260912'
          if (gh release view $tag --repo tysudess/noticias-monitor 2>$null) { gh release delete $tag --repo tysudess/noticias-monitor --yes --cleanup-tag }
          gh release create $tag $zip "$zip.sha256" --repo tysudess/noticias-monitor --target work/v17-qt-preview-engine --title 'Monitor V17 — Editor de Vídeo Motor Qt Original — Windows Portable' --notes 'Preview reconstruído sobre o mesmo motor funcional do editor antigo: PySide6 QMediaPlayer + QAudioOutput + QVideoWidget + timer de 55 ms. Layout aprovado preservado. Host empacotado com PySide6 6.9.1 e PyInstaller 6.15.0 em onedir, seguindo o programa antigo.'
          Write-Host "SHA256=$hash"
