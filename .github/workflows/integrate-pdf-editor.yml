name: Integrate PDF Editor Tab

on:
  push:
    branches:
      - work/v8-next
    paths:
      - '.github/workflows/integrate-pdf-editor.yml'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreen.kt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-next
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Patch Dashboard V5 and dependencies
        shell: pwsh
        run: |
          $dashboard = 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt'
          $text = Get-Content $dashboard -Raw

          if ($text -notmatch 'PDF_EDITOR\(') {
            $old = '    SETTINGS("Configurações", "Automação, proxy, inicialização e operação do aplicativo", Icons.Default.Settings)'
            $new = '    SETTINGS("Configurações", "Automação, proxy, inicialização e operação do aplicativo", Icons.Default.Settings),' + "`r`n" + '    PDF_EDITOR("Editor de PDF", "Monte, reorganize, recorte e exporte PDFs e imagens", Icons.Default.PictureAsPdf)'
            if (-not $text.Contains($old)) { throw 'Ponto de inserção V5Section não encontrado.' }
            $text = $text.Replace($old, $new)
          }

          if ($text -notmatch 'V5Section\.PDF_EDITOR -> PdfEditorScreen\(\)') {
            $old = '                            V5Section.SETTINGS -> V5SettingsScreen(c, tick)'
            $new = $old + "`r`n" + '                            V5Section.PDF_EDITOR -> PdfEditorScreen()'
            if (-not $text.Contains($old)) { throw 'Ponto de inserção da tela PDF não encontrado.' }
            $text = $text.Replace($old, $new)
          }

          Set-Content $dashboard $text -Encoding UTF8

          $gradle = 'desktop/build.gradle.kts'
          $g = Get-Content $gradle -Raw
          if ($g -notmatch 'org\.apache\.pdfbox:pdfbox') {
            $anchor = '    implementation("org.xerial:sqlite-jdbc:3.46.1.3")'
            $deps = $anchor + "`r`n" +
                    '    implementation("org.apache.pdfbox:pdfbox:3.0.3")' + "`r`n" +
                    '    implementation("com.twelvemonkeys.imageio:imageio-webp:3.12.0")' + "`r`n" +
                    '    implementation("com.twelvemonkeys.imageio:imageio-tiff:3.12.0")'
            if (-not $g.Contains($anchor)) { throw 'Âncora de dependências não encontrada.' }
            $g = $g.Replace($anchor, $deps)
            Set-Content $gradle $g -Encoding UTF8
          }

      - name: Compile desktop
        shell: pwsh
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Commit integration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/build.gradle.kts desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: add PDF editor tab to V8 dashboard'
            git push origin HEAD:work/v8-next
          }
