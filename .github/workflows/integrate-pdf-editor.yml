name: Integrate PDF Editor Tab

on:
  push:
    branches:
      - work/v8-next
    paths:
      - '.github/workflows/integrate-pdf-editor.yml'
      - 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/PdfEditorScreenV2.kt'
      - 'desktop/src/main/resources/pdf-default-cover.b64'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8-next
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Activate PDF editor V2
        shell: pwsh
        run: |
          $dashboard = 'desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt'
          $text = Get-Content $dashboard -Raw
          $text = $text.Replace('V5Section.PDF_EDITOR -> PdfEditorScreen()', 'V5Section.PDF_EDITOR -> PdfEditorScreenV2()')
          Set-Content $dashboard $text -Encoding UTF8

      - name: Compile desktop
        shell: pwsh
        run: gradle :desktop:compileKotlin --stacktrace

      - name: Commit validated V2 activation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DashboardV5Main.kt
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: activate PDF editor V2 layout and precise crop'
            git push origin HEAD:work/v8-next
          }
